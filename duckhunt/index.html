<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duck Hunt 8-bit</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦆</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            cursor: none;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        
        #gameContainer {
            position: relative;
            width: 480px;
            height: 853px;
            max-width: 100vw;
            max-height: 100vh;
            background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }
        
        #score, #level, #weapon {
            font-size: 16px;
            color: white;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        #weaponSelector {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            pointer-events: auto;
        }
        
        .weapon-btn {
            width: 60px;
            height: 60px;
            border: 3px solid #fff;
            border-radius: 8px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .weapon-btn:hover {
            transform: scale(1.1);
        }
        
        .weapon-btn.active {
            border-color: #ffd700;
            background: rgba(255,215,0,0.3);
        }
        
        .weapon-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: #fff;
        }
        
        #startScreen h1, #gameOverScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ffd700;
            text-shadow: 3px 3px 0 #000;
        }
        
        #startScreen p, #gameOverScreen p {
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover {
            transform: scale(1.1);
            background: #ffed4a;
        }
        
        #gameOverScreen {
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="score">🦆 0</div>
            <div id="level">Уровень: 1</div>
            <div id="weapon">🔫 Дробовик</div>
        </div>
        
        <div id="weaponSelector">
            <button class="weapon-btn active" data-weapon="shotgun">
                <span>🔫</span>
                <span>Дробь</span>
            </button>
            <button class="weapon-btn disabled" data-weapon="rifle">
                <span>🎯</span>
                <span>Винтовка</span>
            </button>
            <button class="weapon-btn disabled" data-weapon="sniper">
                <span>🔭</span>
                <span>Снайпер</span>
            </button>
        </div>
        
        <div id="startScreen">
            <h1>🦆 DUCK HUNT</h1>
            <p>Охоться на уток!<br>Целься в жёлтую зону и жди сужения красного круга.</p>
            <button class="btn" id="startBtn">НАЧАТЬ</button>
        </div>
        
        <div id="gameOverScreen">
            <h1>ИГРА ОКОНЧЕНА</h1>
            <p id="finalScore">Счёт: 0</p>
            <button class="btn" id="restartBtn">ЗАНОВО</button>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const weaponElement = document.getElementById('weapon');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');
        const weaponButtons = document.querySelectorAll('.weapon-btn');
        
        // Фиксированный размер канваса
        canvas.width = 480;
        canvas.height = 853;
        
        // Конфигурация оружия
        const weapons = {
            shotgun: {
                name: 'Дробовик',
                icon: '🔫',
                accuracy: 0.3, // Размер зоны разброса (меньше = точнее)
                damage: 1,
                unlockScore: 0,
                description: 'Базовое оружие'
            },
            rifle: {
                name: 'Винтовка',
                icon: '🎯',
                accuracy: 0.15,
                damage: 1,
                unlockScore: 10,
                description: 'Точнее дробовика'
            },
            sniper: {
                name: 'Снайпер',
                icon: '🔭',
                accuracy: 0.05,
                damage: 1,
                unlockScore: 25,
                description: 'Максимальная точность'
            }
        };
        
        // Состояние игры
        let gameState = 'start'; // start, playing, gameover
        let score = 0;
        let level = 1;
        let currentWeapon = 'shotgun';
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let canAim = true;
        let shotSnapshot = null;
        let shotSnapshotTime = 0;
        let isPaused = false;
        let pauseEndTime = 0;
        let isWindowFocused = true;
        let ducksShot = 0; // Убито уток для прогрессии уровня
        
        // Массив уток
        let ducks = [];
        const MAX_DUCKS_PER_WAVE = 3;
        
        // Система прогрессии
        function getDucksForLevel(level) {
            return Math.min(2 + Math.floor(level / 2), MAX_DUCKS_PER_WAVE);
        }
        
        function getDuckSpeed(level) {
            return 180 + level * 30;
        }
        
        function spawnDuck() {
            const duck = {
                x: 50 + Math.random() * (canvas.width - 150),
                y: 50 + Math.random() * (canvas.height / 3),
                width: 50,
                height: 40,
                vx: (Math.random() - 0.5) * getDuckSpeed(level),
                vy: (Math.random() - 0.5) * getDuckSpeed(level),
                wingUp: true,
                wingFrame: 0,
                wingTimer: 0,
                isDead: false,
                deathY: 0,
                id: Math.random()
            };
            
            // Ограничение минимальной скорости
            if (Math.abs(duck.vx) < 180) duck.vx = duck.vx > 0 ? 180 : -180;
            if (Math.abs(duck.vy) < 180) duck.vy = duck.vy > 0 ? 180 : -180;
            
            return duck;
        }
        
        function spawnWave() {
            const ducksCount = getDucksForLevel(level);
            ducks = [];
            for (let i = 0; i < ducksCount; i++) {
                ducks.push(spawnDuck());
            }
        }

        // Обработчики кнопок оружия
        weaponButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const weaponType = btn.dataset.weapon;
                const weapon = weapons[weaponType];
                
                // Проверка доступности оружия
                if (score < weapon.unlockScore) return;
                
                currentWeapon = weaponType;
                
                // Обновление UI
                weaponButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                weaponElement.textContent = `${weapon.icon} ${weapon.name}`;
            });
        });
        
        // Обработчики экранов
        document.getElementById('startBtn').addEventListener('click', () => {
            startScreen.style.display = 'none';
            gameState = 'playing';
            spawnWave();
        });
        
        document.getElementById('restartBtn').addEventListener('click', () => {
            gameOverScreen.style.display = 'none';
            score = 0;
            level = 1;
            ducksShot = 0;
            currentWeapon = 'shotgun';
            
            // Сброс UI оружия
            weaponButtons.forEach(b => {
                b.classList.remove('active', 'disabled');
                if (b.dataset.weapon !== 'shotgun') {
                    b.classList.add('disabled');
                }
            });
            weaponButtons[0].classList.add('active');
            
            weaponElement.textContent = `${weapons.shotgun.icon} ${weapons.shotgun.name}`;
            scoreElement.textContent = `🦆 0`;
            levelElement.textContent = `Уровень: 1`;
            
            gameState = 'playing';
            spawnWave();
        });

        // Пауза при потере фокуса вкладки
        document.addEventListener('visibilitychange', () => {
            if (document.hidden || gameState !== 'playing') {
                isPaused = true;
                isWindowFocused = false;
            } else {
                isPaused = false;
                isWindowFocused = true;
                pauseEndTime = Date.now() + 500;
            }
        });

        // Пауза при потере фокуса окна
        window.addEventListener('blur', () => {
            isPaused = true;
            isWindowFocused = false;
        });

        window.addEventListener('focus', () => {
            if (gameState === 'playing') {
                isPaused = false;
                isWindowFocused = true;
                pauseEndTime = Date.now() + 500;
            }
        });

        // Прицеливание
        const aim = {
            isActive: false,
            progress: 0,
            aimTime: 5000,
            currentAimTime: 0,
            cooldown: 500,
            cooldownStart: 0,
            targetDuck: null // Утка, на которую целимся
        };

        // Облака
        const clouds = [];
        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * (canvas.height / 3),
                width: 60 + Math.random() * 40,
                speed: 0.3 + Math.random() * 0.5
            });
        }
        
        // Отслеживание мыши с учётом масштаба канваса
        function updateMousePosition(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouseX = (clientX - rect.left) * scaleX;
            mouseY = (clientY - rect.top) * scaleY;
        }
        
        document.addEventListener('mousemove', (e) => {
            if (gameState === 'playing') {
                updateMousePosition(e.clientX, e.clientY);
            }
        });

        // Обработка отпускания мыши - выстрел
        document.addEventListener('mouseup', (e) => {
            if (gameState !== 'playing') return;
            updateMousePosition(e.clientX, e.clientY);
            fireShot();
        });

        // Тач-управление
        let isTouching = false;

        document.addEventListener('touchstart', (e) => {
            if (gameState !== 'playing') return;
            e.preventDefault();
            const touch = e.touches[0];
            updateMousePosition(touch.clientX, touch.clientY);
            isTouching = true;
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (gameState !== 'playing') return;
            e.preventDefault();
            const touch = e.touches[0];
            updateMousePosition(touch.clientX, touch.clientY);
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (gameState !== 'playing') return;
            e.preventDefault();
            isTouching = false;
            fireShot();
        }, { passive: false });

        // Проверка попадания в утку (по частям тела)
        function checkHitDuck(duck, shotX, shotY) {
            const x = duck.x;
            const y = duck.y;
            const w = duck.width;
            const h = duck.height;

            // Тело (оранжево-коричневое): x+10, y+15, ширина w-20, высота h-15
            if (shotX >= x + 10 && shotX <= x + 10 + (w - 20) &&
                shotY >= y + 15 && shotY <= y + 15 + (h - 15)) {
                return true;
            }

            // Голова (зеленая): x+w-20, y+5, ширина 18, высота 18
            if (shotX >= x + w - 20 && shotX <= x + w - 20 + 18 &&
                shotY >= y + 5 && shotY <= y + 5 + 18) {
                return true;
            }

            // Крыло (коричневое): зависит от анимации
            if (duck.wingUp) {
                // Крыло вверх: x+15, y, ширина 20, высота 18
                if (shotX >= x + 15 && shotX <= x + 15 + 20 &&
                    shotY >= y && shotY <= y + 18) {
                    return true;
                }
            } else {
                // Крыло вниз: x+15, y+12, ширина 20, высота 18
                if (shotX >= x + 15 && shotX <= x + 15 + 20 &&
                    shotY >= y + 12 && shotY <= y + 12 + 18) {
                    return true;
                }
            }

            // Хвост: x+8, y+18, ширина 8, высота 10
            if (shotX >= x + 8 && shotX <= x + 8 + 8 &&
                shotY >= y + 18 && shotY <= y + 18 + 10) {
                return true;
            }

            // Клюв: x+w-4, y+12, ширина 8, высота 6
            if (shotX >= x + w - 4 && shotX <= x + w - 4 + 8 &&
                shotY >= y + 12 && shotY <= y + 12 + 6) {
                return true;
            }

            return false;
        }

        // Функция выстрела
        function fireShot() {
            // Проверка: окно в фокусе и не сразу после паузы
            if (!isWindowFocused) return;
            if (Date.now() < pauseEndTime) return;
            if (!canAim) return;
            
            // Проверка: курсор/палец должен быть в зоне прицеливания
            if (!checkAimZone()) return;
            
            const weapon = weapons[currentWeapon];
            const accuracy = weapon.accuracy;
            
            // Находим ближайшую утку к центру прицела
            let targetDuck = null;
            let minDistance = Infinity;
            
            for (const duck of ducks) {
                if (duck.isDead) continue;
                
                const duckCenterX = duck.x + duck.width / 2;
                const duckCenterY = duck.y + duck.height / 2;
                const dx = mouseX - duckCenterX;
                const dy = mouseY - duckCenterY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance <= 100 && distance < minDistance) {
                    minDistance = distance;
                    targetDuck = duck;
                }
            }
            
            if (!targetDuck) return;
            
            const duckCenterX = targetDuck.x + targetDuck.width / 2;
            const duckCenterY = targetDuck.y + targetDuck.height / 2;

            // Текущий размер красного квадрата с учётом точности оружия
            const baseSize = 200;
            const minSize = 20;
            const currentSize = (baseSize - (baseSize - minSize) * aim.progress) * accuracy;
            const halfSize = currentSize / 2;

            // Случайная точка внутри текущего красного квадрата
            const shotX = duckCenterX - halfSize + Math.random() * currentSize;
            const shotY = duckCenterY - halfSize + Math.random() * currentSize;

            // Проверка попадания в утку (по частям тела)
            const hitDuck = checkHitDuck(targetDuck, shotX, shotY);

            if (hitDuck) {
                // Попадание!
                targetDuck.isDead = true;
                targetDuck.deathY = targetDuck.y;
                score++;
                ducksShot++;
                scoreElement.textContent = `🦆 ${score}`;
                
                // Проверка разблокировки нового оружия
                updateWeaponButtons();
                
                // Проверка повышения уровня
                checkLevelUp();
                
                aim.isActive = false;
                aim.progress = 0;
                aim.currentAimTime = 0;
                
                // Сохраняем позицию для отрисовки приготовленной утки
                shotSnapshot = {
                    x: targetDuck.x,
                    y: targetDuck.y,
                    isHit: true,
                    duckId: targetDuck.id
                };
                shotSnapshotTime = Date.now();
            } else {
                // Промах - кулдаун
                aim.isActive = false;
                aim.progress = 0;
                aim.currentAimTime = 0;
                canAim = false;
                aim.cooldownStart = Date.now();
                createShotSnapshot(shotX, shotY, false);
            }
        }
        
        // Проверка и обновление доступности оружия
        function updateWeaponButtons() {
            weaponButtons.forEach(btn => {
                const weaponType = btn.dataset.weapon;
                const weapon = weapons[weaponType];
                
                if (score >= weapon.unlockScore) {
                    btn.classList.remove('disabled');
                }
            });
        }
        
        // Проверка повышения уровня
        function checkLevelUp() {
            const ducksNeededForNextLevel = 5 * level;
            if (ducksShot >= ducksNeededForNextLevel) {
                level++;
                levelElement.textContent = `Уровень: ${level}`;
                spawnWave();
            } else {
                // Проверка: все ли утки в волне убиты
                const allDead = ducks.every(d => d.isDead);
                if (allDead && ducks.length > 0) {
                    setTimeout(spawnWave, 1000);
                }
            }
        }
        
        // Проверка попадания в хитбокс утки (радиус 100px от центра)
        function checkAimZone() {
            // Находим ближайшую утку
            for (const duck of ducks) {
                if (duck.isDead) continue;
                
                const duckCenterX = duck.x + duck.width / 2;
                const duckCenterY = duck.y + duck.height / 2;
                const dx = mouseX - duckCenterX;
                const dy = mouseY - duckCenterY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance <= 100) {
                    aim.targetDuck = duck;
                    return true;
                }
            }
            
            aim.targetDuck = null;
            return false;
        }
        
        // Сообщения при промахе
        const missMessages = [
            'ПРОМАХ',
            'ЦЕЛЬСЯ ЛУЧШЕ',
            'ГЛАЗ-АЛМАЗ (НЕТ)',
            'КУДА ТЫ?',
            'МАСТЕР ОХОТЫ, ПОЧТИ',
            'МИМО!',
            'СЛЕПАЯ КУРИЦА',
            'ПОПРОБУЙ ЕЩЁ',
            'РУКИ-КРЮКИ',
            'ЭТО БЫЛО БЛИЗКО',
            'СЕГОДНЯ БЕЗ УТЯТИНЫ',
            'ОСТАЛСЯ БЕЗ ОБЕДА',
            'ДА, НО НЕТ',
            'МЮНХАУЗЕН ПОПАЛ БЫ',
            'НЕ СЕГОДНЯ',
            'НЕТ НЕТ, ДА И ДА'
        ];

        // Создание снапшота выстрела
        function createShotSnapshot(shotX, shotY, isHit) {
            // Находим утку для снапшота
            let snapshotDuck = null;
            if (shotSnapshot && shotSnapshot.duckId) {
                snapshotDuck = ducks.find(d => d.id === shotSnapshot.duckId);
            }
            if (!snapshotDuck && ducks.length > 0) {
                snapshotDuck = ducks[0];
            }
            if (!snapshotDuck) return;
            
            const duckCenterX = snapshotDuck.x + snapshotDuck.width / 2;
            const duckCenterY = snapshotDuck.y + snapshotDuck.height / 2;
            const snapshotSize = 200;

            // Создаём offscreen canvas для снапшота
            const snapshotCanvas = document.createElement('canvas');
            snapshotCanvas.width = snapshotSize;
            snapshotCanvas.height = snapshotSize;
            const snapshotCtx = snapshotCanvas.getContext('2d');

            // Рисуем фон (градиент)
            const gradient = snapshotCtx.createLinearGradient(0, 0, 0, snapshotSize);
            gradient.addColorStop(0, '#1E90FF');
            gradient.addColorStop(0.5, '#87CEEB');
            gradient.addColorStop(1, '#98FB98');
            snapshotCtx.fillStyle = gradient;
            snapshotCtx.fillRect(0, 0, snapshotSize, snapshotSize);

            // Рисуем утку (копию текущей)
            const duckLocalX = snapshotDuck.x - (duckCenterX - 100);
            const duckLocalY = snapshotDuck.y - (duckCenterY - 100);

            if (snapshotDuck.isDead) {
                // Падающая утка
                snapshotCtx.fillStyle = '#8B4513';
                snapshotCtx.fillRect(duckLocalX, duckLocalY, snapshotDuck.width, snapshotDuck.height);
                snapshotCtx.fillStyle = '#000';
                snapshotCtx.fillRect(duckLocalX + snapshotDuck.width - 12, duckLocalY + 8, 8, 2);
            } else {
                // Тело
                snapshotCtx.fillStyle = '#D2691E';
                snapshotCtx.fillRect(duckLocalX + 10, duckLocalY + 15, snapshotDuck.width - 20, snapshotDuck.height - 15);
                // Голова
                snapshotCtx.fillStyle = '#228B22';
                snapshotCtx.fillRect(duckLocalX + snapshotDuck.width - 20, duckLocalY + 5, 18, 18);
                // Глаз
                snapshotCtx.fillStyle = '#FFF';
                snapshotCtx.fillRect(duckLocalX + snapshotDuck.width - 12, duckLocalY + 8, 6, 6);
                snapshotCtx.fillStyle = '#000';
                snapshotCtx.fillRect(duckLocalX + snapshotDuck.width - 10, duckLocalY + 10, 3, 3);
                // Клюв
                snapshotCtx.fillStyle = '#FFD700';
                snapshotCtx.fillRect(duckLocalX + snapshotDuck.width - 4, duckLocalY + 12, 8, 6);
                // Крылья
                snapshotCtx.fillStyle = '#8B4513';
                if (snapshotDuck.wingUp) {
                    snapshotCtx.fillRect(duckLocalX + 15, duckLocalY, 20, 18);
                } else {
                    snapshotCtx.fillRect(duckLocalX + 15, duckLocalY + 12, 20, 18);
                }
                // Хвост
                snapshotCtx.fillStyle = '#A0522D';
                snapshotCtx.fillRect(duckLocalX + 8, duckLocalY + 18, 8, 10);
            }

            // Делаем черно-белым
            const imageData = snapshotCtx.getImageData(0, 0, snapshotSize, snapshotSize);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                data[i] = avg;
                data[i + 1] = avg;
                data[i + 2] = avg;
            }
            snapshotCtx.putImageData(imageData, 0, 0);

            // Рисуем точку выстрела на снапшоте
            const localShotX = shotX - (duckCenterX - 100);
            const localShotY = shotY - (duckCenterY - 100);
            snapshotCtx.fillStyle = '#000';
            snapshotCtx.fillRect(localShotX - 1.5, localShotY - 1.5, 3, 3);

            shotSnapshot = {
                canvas: snapshotCanvas,
                x: duckCenterX - 100,
                y: duckCenterY - 100,
                startY: duckCenterY - 100,
                isHit: isHit,
                message: missMessages[Math.floor(Math.random() * missMessages.length)]
            };
            shotSnapshotTime = Date.now();
        }
        
        // Отрисовка пиксельной утки
        function drawDuck(duck) {
            if (duck.isDead) {
                // Не рисуем падающую утку здесь - она рисуется в drawShotSnapshot
                return;
            }

            const x = duck.x;
            const y = duck.y;
            const w = duck.width;
            const h = duck.height;
            
            // Тело (оранжево-коричневое)
            ctx.fillStyle = '#D2691E';
            ctx.fillRect(x + 10, y + 15, w - 20, h - 15);
            
            // Голова (зеленая как у селезня)
            ctx.fillStyle = '#228B22';
            ctx.fillRect(x + w - 20, y + 5, 18, 18);
            
            // Глаз (белый с черной точкой)
            ctx.fillStyle = '#FFF';
            ctx.fillRect(x + w - 12, y + 8, 6, 6);
            ctx.fillStyle = '#000';
            ctx.fillRect(x + w - 10, y + 10, 3, 3);
            
            // Клюв (желтый)
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(x + w - 4, y + 12, 8, 6);
            
            // Крылья (анимированные)
            ctx.fillStyle = '#8B4513';
            if (duck.wingUp) {
                // Крыло вверх
                ctx.fillRect(x + 15, y, 20, 18);
            } else {
                // Крыло вниз
                ctx.fillRect(x + 15, y + 12, 20, 18);
            }
            
            // Хвост
            ctx.fillStyle = '#A0522D';
            ctx.fillRect(x + 8, y + 18, 8, 10);
        }
        
        // Отрисовка облаков
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            clouds.forEach(cloud => {
                // Пиксельное облако из нескольких прямоугольников
                ctx.fillRect(cloud.x, cloud.y, cloud.width, 20);
                ctx.fillRect(cloud.x + 10, cloud.y - 10, cloud.width - 20, 15);
                ctx.fillRect(cloud.x + 20, cloud.y - 15, cloud.width - 40, 12);
            });
        }
        
        // Отрисовка снапшота выстрела
        function drawShotSnapshot() {
            if (!shotSnapshot) return;

            const elapsed = Date.now() - shotSnapshotTime;
            const duration = 2000;

            if (elapsed >= duration) {
                shotSnapshot = null;
                return;
            }

            const progress = elapsed / duration;
            const alpha = 1 - progress;

            // При попадании - рисуем приготовленную утку, которая падает
            if (shotSnapshot.isHit) {
                const duckX = shotSnapshot.x;
                const duckY = shotSnapshot.y + progress * 400; // Падение вниз на 400px
                const duckW = duck.width;
                const duckH = duck.height;

                ctx.save();
                ctx.globalAlpha = alpha;

                // Рисуем жареную утку (коричневая)
                ctx.fillStyle = '#8B4513'; // Тёмно-коричневое тело
                ctx.fillRect(duckX + 10, duckY + 15, duckW - 20, duckH - 15);

                // Голова (тёмно-коричневая)
                ctx.fillStyle = '#654321';
                ctx.fillRect(duckX + duckW - 20, duckY + 5, 18, 18);

                // Закрытый глаз (чёрная линия)
                ctx.fillStyle = '#000';
                ctx.fillRect(duckX + duckW - 12, duckY + 10, 8, 2);

                // Клюв (оранжевый)
                ctx.fillStyle = '#FF8C00';
                ctx.fillRect(duckX + duckW - 4, duckY + 12, 8, 6);

                // Крыло (запечённое)
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(duckX + 15, duckY + 12, 20, 18);

                // Хвост
                ctx.fillStyle = '#4E342E';
                ctx.fillRect(duckX + 8, duckY + 18, 8, 10);

                ctx.restore();
                return;
            }

            // При промахе - рисуем полароид
            const yOffset = progress * 100;
            const photoSize = 200;
            const borderSize = 10;
            const bottomBorder = 50;
            const totalWidth = photoSize + borderSize * 2;
            const totalHeight = photoSize + borderSize + bottomBorder;

            // Исходная позиция фото
            let photoX = shotSnapshot.x;
            let photoY = shotSnapshot.startY - yOffset;

            // Ограничиваем чтобы фото не выходило за границы экрана
            const minX = borderSize;
            const maxX = canvas.width - totalWidth - borderSize;
            const minY = borderSize;
            const maxY = canvas.height - totalHeight - borderSize;

            // Если фото выходит за границы, подвигаем его
            if (photoX < minX) photoX = minX;
            if (photoX > maxX) photoX = maxX;
            if (photoY < minY) photoY = minY;
            if (photoY > maxY) photoY = maxY;

            // Белая рамка Polaroid
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#FFF';
            ctx.fillRect(
                photoX - borderSize,
                photoY - borderSize,
                photoSize + borderSize * 2,
                photoSize + borderSize + bottomBorder
            );

            // Само фото
            ctx.globalAlpha = alpha;
            ctx.drawImage(shotSnapshot.canvas, photoX, photoY);

            // Надпись на рамке
            ctx.fillStyle = '#000';
            ctx.font = 'bold 16px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(shotSnapshot.message, photoX + photoSize / 2, photoY + photoSize + 35);

            ctx.restore();
        }
        
        // Отрисовка прицела
        function drawAim() {
            if (!aim.isActive || !aim.targetDuck) return;
            
            // Проверяем, существует ли ещё утка в массиве
            const duckExists = ducks.some(d => d.id === aim.targetDuck.id);
            if (!duckExists) {
                aim.targetDuck = null;
                return;
            }
            
            const duck = aim.targetDuck;
            const duckCenterX = duck.x + duck.width / 2;
            const duckCenterY = duck.y + duck.height / 2;
            const size = 200; // 100px радиус = 200px квадрат
            
            // Рисуем внешний квадрат зоны прицеливания (всегда 200x200)
            ctx.strokeStyle = '#FFFF00';
            ctx.lineWidth = 3;
            ctx.strokeRect(duckCenterX - 100, duckCenterY - 100, size, size);
            
            // Заполнение зоны прицеливания
            ctx.fillStyle = 'rgba(255, 255, 0, 0.1)';
            ctx.fillRect(duckCenterX - 100, duckCenterY - 100, size, size);
            
            // Индикатор прогресса (сжимается от 200 до 20 пикселей)
            const currentSize = 200 - (200 - 20) * aim.progress;
            ctx.strokeStyle = '#FF0000';
            ctx.lineWidth = 2;
            ctx.strokeRect(
                duckCenterX - currentSize / 2,
                duckCenterY - currentSize / 2,
                currentSize,
                currentSize
            );
        }
        
        // Отрисовка индикатора кулдауна
        function drawCooldown() {
            if (canAim) return;
            
            const elapsed = Date.now() - aim.cooldownStart;
            const remaining = Math.max(0, aim.cooldown - elapsed);
            
            if (remaining > 0) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.fillRect(mouseX - 15, mouseY - 15, 30, 30);
                ctx.fillStyle = '#FFF';
                ctx.font = '12px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(Math.ceil(remaining / 100), mouseX, mouseY + 4);
            }
        }
        
        // Отрисовка курсора-прицела
        function drawCursor() {
            const size = 20;
            const half = size / 2;
            
            ctx.strokeStyle = '#FF0000';
            ctx.lineWidth = 2;
            
            // Перекрестие
            ctx.beginPath();
            ctx.moveTo(mouseX - half - 5, mouseY);
            ctx.lineTo(mouseX - 2, mouseY);
            ctx.moveTo(mouseX + 2, mouseY);
            ctx.lineTo(mouseX + half + 5, mouseY);
            ctx.moveTo(mouseX, mouseY - half - 5);
            ctx.lineTo(mouseX, mouseY - 2);
            ctx.moveTo(mouseX, mouseY + 2);
            ctx.lineTo(mouseX, mouseY + half + 5);
            ctx.stroke();
            
            // Точка в центре
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(mouseX - 2, mouseY - 2, 4, 4);
        }
        
        // Отрисовка фона (градиент неба)
        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1E90FF');
            gradient.addColorStop(0.5, '#87CEEB');
            gradient.addColorStop(1, '#98FB98');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Земля (трава внизу)
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            
            // Пиксельная трава
            ctx.fillStyle = '#32CD32';
            for (let i = 0; i < canvas.width; i += 10) {
                ctx.fillRect(i, canvas.height - 50, 4, 10);
                ctx.fillRect(i + 5, canvas.height - 55, 4, 8);
            }
        }
        
        // Обновление логики утки
        function updateDuck(duck, deltaTime) {
            const dt = deltaTime / 1000;

            if (duck.isDead) {
                duck.y += 480 * dt;
                if (duck.y > canvas.height) {
                    // Удаляем утку из массива
                    const index = ducks.findIndex(d => d.id === duck.id);
                    if (index !== -1) {
                        ducks.splice(index, 1);
                    }
                }
                return;
            }

            // Движение утки
            duck.x += duck.vx * dt;
            duck.y += duck.vy * dt;

            // Отскок от стен
            if (duck.x <= 0 || duck.x + duck.width >= canvas.width - 50) {
                duck.vx = -duck.vx;
                if (duck.x < 0) duck.x = 0;
                if (duck.x + duck.width > canvas.width - 50) duck.x = canvas.width - 50 - duck.width;
            }
            if (duck.y <= 50 || duck.y + duck.height >= canvas.height - 50) {
                duck.vy = -duck.vy;
                if (duck.y < 50) duck.y = 50;
                if (duck.y + duck.height > canvas.height - 50) duck.y = canvas.height - 50 - duck.height;
            }
            
            // Анимация крыльев
            duck.wingTimer += deltaTime;
            if (duck.wingTimer > 150) {
                duck.wingUp = !duck.wingUp;
                duck.wingTimer = 0;
            }
            
            // Случайное изменение направления
            if (Math.random() < 0.6 * dt) {
                duck.vy = (Math.random() - 0.5) * 480;
            }
            if (Math.random() < 0.6 * dt) {
                duck.vx = (Math.random() - 0.5) * 480;
                if (Math.abs(duck.vx) < 180) duck.vx = duck.vx > 0 ? 180 : -180;
            }
        }

        // Обновление всех уток
        function updateDucks(deltaTime) {
            for (const duck of ducks) {
                updateDuck(duck, deltaTime);
            }
            
            // Проверка: все ли утки убиты или упали
            const activeDucks = ducks.filter(d => !d.isDead && d.y <= canvas.height);
            if (activeDucks.length === 0 && ducks.length > 0) {
                setTimeout(spawnWave, 1000);
            }
        }

        // Респавн утки (теперь не используется, спавним волнами)
        function respawnDuck() {
            // Эта функция больше не нужна, оставляем для совместимости
        }
        
        // Обновление облаков
        function updateClouds() {
            clouds.forEach(cloud => {
                cloud.x += cloud.speed;
                if (cloud.x > canvas.width) {
                    cloud.x = -cloud.width;
                    cloud.y = Math.random() * (canvas.height / 3);
                }
            });
        }
        
        // Игровой цикл
        let lastTime = 0;
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            // Ограничиваем deltaTime
            const clampedDelta = Math.min(deltaTime, 100);

            // Очистка
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Обновление (только если не на паузе)
            if (!isPaused && gameState === 'playing') {
                updateClouds();
                updateDucks(clampedDelta);
            }

            // Проверка прицеливания
            const inAimZone = isPaused ? false : checkAimZone();

            // Проверка окончания кулдауна
            if (!canAim && !isPaused) {
                const elapsed = Date.now() - aim.cooldownStart;
                if (elapsed >= aim.cooldown) {
                    canAim = true;
                }
            }

            // Прицеливание активно если: курсор/палец в зоне прицеливания (и не пауза)
            const aimInputActive = !isPaused && inAimZone;

            if (aimInputActive && canAim) {
                if (!aim.isActive) {
                    aim.isActive = true;
                    aim.currentAimTime = 0;
                }
                aim.currentAimTime += deltaTime;
                aim.progress = Math.min(aim.currentAimTime / aim.aimTime, 1);
            } else {
                if (!isPaused) {
                    aim.isActive = false;
                    aim.progress = 0;
                    aim.currentAimTime = 0;
                }
            }

            // Сохраняем контекст для эффектов
            ctx.save();

            // Если на паузе - применяем десатурацию
            if (isPaused) {
                ctx.filter = 'saturate(0.1)';
            }

            // Отрисовка
            drawBackground();
            drawClouds();
            
            // Рисуем всех уток
            for (const duck of ducks) {
                drawDuck(duck);
            }
            
            drawAim();
            drawCursor();
            drawCooldown();
            drawShotSnapshot();

            // Восстанавливаем контекст
            ctx.restore();

            // Рисуем надпись ПАУЗА
            if (isPaused && gameState === 'playing') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.font = 'bold 72px Courier New';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('ПАУЗА', canvas.width / 2, canvas.height / 2);
            }

            requestAnimationFrame(gameLoop);
        }

        // Старт игры
        spawnWave();
        requestAnimationFrame(gameLoop);
    </script>
</body>
